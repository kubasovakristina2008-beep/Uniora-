<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="profile.title">Профиль — Uniora</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="uniora-nav"></div>

<div class="wizard-shell">
  <aside class="wizard-sidebar">
    <div class="wizard-sidebar__logo">✦ Uniora</div>
    <div class="wizard-sidebar__steps" id="wizard-steps"></div>
  </aside>
  <main class="wizard-main">
    <div class="wizard-main__inner">
      <div id="step-content"></div>

      <div class="step-actions">
        <button class="btn btn--secondary" id="btn-back">Назад</button>
        <button class="btn btn--primary" id="btn-next">Далее</button>
      </div>
    </div>
  </main>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/match.js"></script>
<script src="js/common.js"></script>
<script src="js/profile.js"></script>
<script>
  Uniora.common.renderNav("profile");
  Uniora.profile.init();
</script>
</body>
</html>
